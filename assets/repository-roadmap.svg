<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Linux World repository roadmap</title><desc id="desc">Four stages covering Linux foundations, administration, engineering, and production mastery.</desc>
  <rect width="1200" height="500" rx="24" fill="#07130d"/>
  <text x="600" y="62" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="36" font-weight="700">LINUX WORLD ROADMAP</text>
  <line x1="150" y1="248" x2="1050" y2="248" stroke="#4ade80" stroke-width="8"/>
  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <circle cx="160" cy="248" r="32" fill="#4ade80"/><text x="160" y="257" fill="#07130d" font-size="24">01</text>
    <text x="160" y="145" fill="#86efac" font-size="25">FOUNDATIONS</text><text x="160" y="185" fill="#d1fae5" font-size="18">Shell · Files · Text</text><text x="160" y="334" fill="#f8fafc" font-size="18">Build confidence</text>
    <circle cx="450" cy="248" r="32" fill="#4ade80"/><text x="450" y="257" fill="#07130d" font-size="24">02</text>
    <text x="450" y="145" fill="#86efac" font-size="25">ADMINISTRATION</text><text x="450" y="185" fill="#d1fae5" font-size="18">Users · Services · Storage</text><text x="450" y="334" fill="#f8fafc" font-size="18">Operate systems</text>
    <circle cx="750" cy="248" r="32" fill="#4ade80"/><text x="750" y="257" fill="#07130d" font-size="24">03</text>
    <text x="750" y="145" fill="#86efac" font-size="25">ENGINEERING</text><text x="750" y="185" fill="#d1fae5" font-size="18">Network · Security · Automation</text><text x="750" y="334" fill="#f8fafc" font-size="18">Build reliable platforms</text>
    <circle cx="1040" cy="248" r="32" fill="#4ade80"/><text x="1040" y="257" fill="#07130d" font-size="24">04</text>
    <text x="1040" y="145" fill="#86efac" font-size="25">PRODUCTION</text><text x="1040" y="185" fill="#d1fae5" font-size="18">Observe · Debug · Recover</text><text x="1040" y="334" fill="#f8fafc" font-size="18">Handle real failures</text>
  </g>
  <rect x="210" y="400" width="780" height="52" rx="26" fill="#153d28"/>
  <text x="600" y="433" text-anchor="middle" fill="#d1fae5" font-family="Arial, sans-serif" font-size="20" font-weight="700">LEARN → PRACTICE → BREAK SAFELY → TROUBLESHOOT → VERIFY</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Linux World</title>
  <desc id="desc">A dark green Linux terminal themed banner for the Linux World repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07130d"/><stop offset="1" stop-color="#153d28"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#4ade80" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="26" fill="url(#grid)"/>
  <rect x="65" y="65" width="420" height="290" rx="18" fill="#07100b" stroke="#4ade80" stroke-opacity=".45"/>
  <circle cx="95" cy="94" r="7" fill="#ef4444"/><circle cx="119" cy="94" r="7" fill="#fbbf24"/><circle cx="143" cy="94" r="7" fill="#22c55e"/>
  <text x="92" y="155" fill="#86efac" font-family="Arial, sans-serif" font-size="25" font-weight="700">ann@linux-world:~$</text>
  <text x="92" y="198" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24">learn --build --operate</text>
  <text x="92" y="241" fill="#86efac" font-family="Arial, sans-serif" font-size="25" font-weight="700">systemctl status skills</text>
  <text x="92" y="284" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24">● active (running)</text>
  <rect x="92" y="313" width="18" height="28" fill="#4ade80"/>
  <text x="550" y="164" fill="#f8fafc" font-family="Arial, sans-serif" font-size="82" font-weight="700">LINUX WORLD</text>
  <text x="554" y="218" fill="#86efac" font-family="Arial, sans-serif" font-size="28" font-weight="700">FROM FIRST COMMAND TO PRODUCTION</text>
  <line x1="554" y1="251" x2="1090" y2="251" stroke="#4ade80" stroke-width="4"/>
  <text x="554" y="298" fill="#d1fae5" font-family="Arial, sans-serif" font-size="24">Documentation · Labs · Projects · Operations</text>
  <text x="554" y="336" fill="#d1fae5" font-family="Arial, sans-serif" font-size="24">Security · Automation · Troubleshooting</text>
  <text x="1090" y="387" text-anchor="end" fill="#86efac" font-family="Arial, sans-serif" font-size="19" font-weight="700">VERIQTA</text>
</svg>

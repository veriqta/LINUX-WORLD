---
- name: Prepare isolated Linux World lab
  hosts: lab
  become: true
  gather_facts: true
  tasks:
    - name: Refuse unexpected hostnames
      ansible.builtin.assert:
        that: "'lab' in ansible_hostname or 'test' in ansible_hostname"
        fail_msg: "Target hostname does not identify an isolated lab"
    - name: Create lab workspace
      ansible.builtin.file:
        path: /opt/linux-world-lab
        state: directory
        owner: root
        group: root
        mode: '0755'
